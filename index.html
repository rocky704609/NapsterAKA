<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App Store Page</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#202124;font:15px Arial,sans-serif}.bar{background:#fff;border-bottom:1px solid #e2e5e9;padding:18px max(18px,calc((100% - 900px)/2));font-weight:bold;color:#287b46}.wrap{max-width:900px;margin:22px auto;padding:0 15px}.card{background:white;border:1px solid #e2e5e9;border-radius:18px;padding:22px;margin-bottom:16px}.apphead{display:flex;gap:18px;align-items:center}.logo{width:92px;height:92px;object-fit:cover;border-radius:22px;background:#e9edf2}.muted{color:#6c727a}.title{font-size:25px;margin:0 0 8px}.btn{display:inline-block;background:#18864b;color:white;padding:13px 24px;border-radius:24px;text-decoration:none;font-weight:bold;margin-top:14px}.stats{display:flex;gap:0;margin:22px 0}.stat{flex:1;text-align:center;border-right:1px solid #e3e6ea}.stat:last-child{border:0}.stat strong{display:block;font-size:18px}.shots{display:flex;gap:12px;overflow:auto}.shots img{height:230px;width:130px;object-fit:cover;border:1px solid #ddd;border-radius:12px}.review{border-top:1px solid #eee;padding:14px 0}.stars{color:#18864b;font-weight:bold}@media(max-width:600px){.card{padding:17px}.apphead{align-items:flex-start}.logo{width:76px;height:76px}.title{font-size:21px}.stats{gap:8px}.stat strong{font-size:16px}}
</style></head><body><div class="bar">NapsterAKA </div><main class="wrap"><section class="card"><div class="apphead"><img id="logo" class="logo" alt="App logo"><div><h1 id="name" class="title">NapsterAKA</h1><div id="developer" style="color:#18864b">NapsterAKA</div><div id="category" class="muted">Tools</div><a id="download" class="btn" href="#" download>Download APK</a><div id="apkNote" class="muted" style="font-size:12px;margin-top:8px"></div></div></div><div class="stats"><div class="stat"><strong id="rating">4.7 ★</strong><span class="muted">Rating</span></div><div class="stat"><strong id="downloads">10K+</strong><span class="muted">Downloads</span></div><div class="stat"><strong id="age">Everyone</strong><span class="muted">Age rating</span></div></div><h2>About this app</h2><p id="description">Discover the app and its features.</p><p class="muted" id="details"></p></section><section class="card"><h2>Screenshots</h2><div class="shots" id="shots"></div></section><section class="card"><h2>Ratings &amp; reviews</h2><h2 id="summary">4.7 ★</h2><p class="muted" id="count">20k+ reviews</p><div id="reviews"></div><p class="muted" style="font-size:12px">Ratings and reviews shown here are managed by this website, not verified Google Play reviews.</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://gxmmndicbbllejxuuort.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable__VhUTuGnQqRB-cSpdgq-Uw_EkJKFxfz';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
function txt(id,v){document.getElementById(id).textContent=v??''}
async function loadPage(){const {data:row,error}=await sb.from('aka_content').select('content').eq('id',1).maybeSingle();if(error){console.error(error);txt('apkNote','Unable to load app details.');return}const d=row?.content||{},b=d.basics||{},det=d.details||{},r=d.ratings||{};
txt('name',b.name||'NapsterAKA');document.title=(b.name||'NapsterAKA')+' — App Page';txt('developer',b.developer||'NapsterAKA');txt('category',b.category||'Tools');txt('rating',(b.rating||r.summary||'4.7')+' ★');txt('downloads',b.downloads||'10K+');txt('age',b.age||'Everyone');txt('description',b.description||'Discover the app and its features.');txt('details',[det.version?'Version '+det.version:'',det.size?'Size '+det.size:'',det.updated?'Updated '+det.updated:''].filter(Boolean).join(' · '));txt('summary',(r.summary||b.rating||'4.7')+' ★');txt('count',(r.count||b.totalReviews||'0')+' reviews');
if(d.logoData)document.getElementById('logo').src=d.logoData;else document.getElementById('logo').src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100%" height="100%" rx="20" fill="#dce8df"/><text x="50%" y="54%" text-anchor="middle" font-size="20" fill="#18864b">AKA</text></svg>');
const shots=document.getElementById('shots');shots.innerHTML='';(d.screens||[]).slice(0,5).forEach(s=>{let i=document.createElement('img');i.src=s;shots.appendChild(i)});if(!d.screens?.length)shots.innerHTML='<p class="muted">Screenshots will appear here soon.</p>';
const dl=document.getElementById('download');if(d.apkUrl){dl.href=d.apkUrl;dl.setAttribute('download',d.apkName||'NapsterAKA.apk');txt('apkNote',d.apkName||'APK available')}else{dl.removeAttribute('href');txt('apkNote','No APK available yet.');dl.onclick=e=>{e.preventDefault();alert('APK is not available yet.')}}
const rev=document.getElementById('reviews');rev.innerHTML='';(d.reviews||[]).forEach(x=>{let el=document.createElement('div');el.className='review';let h=document.createElement('strong');h.textContent=x.name||'App user';let s=document.createElement('div');s.className='stars';s.textContent='★'.repeat(Math.max(0,Math.min(5,Number(x.stars)||0)));let p=document.createElement('p');p.textContent=x.review||'';let date=document.createElement('small');date.className='muted';date.textContent=x.date||'';el.append(h,s,p,date);rev.appendChild(el)})}
loadPage();
</script></body></html>
